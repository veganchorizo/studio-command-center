services:
  studio-os:
    image: ${STUDIO_OS_IMAGE:-ghcr.io/veganchorizo/studio-command-center:latest}
    container_name: studio-os
    ports:
      - "${STUDIO_OS_PORT:-8080}:3000"
    environment:
      # Points at YOUR existing Ollama container on the shared network below.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    restart: unless-stopped
    networks:
      - ollama-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # The network your Ollama container already runs on.
  # Find it with: docker inspect -f '{{json .NetworkSettings.Networks}}' <ollama-container>
  ollama-net:
    external: true
    name: ${OLLAMA_NETWORK:-ollama_default}
