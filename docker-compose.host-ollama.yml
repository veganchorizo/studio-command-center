# Use this instead of docker-compose.yml when Ollama runs directly on the host
# (not in Docker):  docker compose -f docker-compose.host-ollama.yml up -d
services:
  studio-os:
    image: ${STUDIO_OS_IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: studio-os
    ports:
      - "${STUDIO_OS_PORT:-8080}:3000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      STUDIO_ADMIN_EMAIL: ${STUDIO_ADMIN_EMAIL:-admin@studio.local}
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:-}
      STUDIO_ADMIN_NAME: ${STUDIO_ADMIN_NAME:-Studio Owner}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STUDIO_SECURE_COOKIES: ${STUDIO_SECURE_COOKIES:-false}
    volumes:
      - studio-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  studio-data:
